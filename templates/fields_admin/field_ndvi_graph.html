<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field NDVI Analytics</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        
        .header {
            background: #1a237e;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 { font-size: 18px; }
        .header h1 i { margin-right: 8px; }
        .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .header-actions a {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 4px;
            background: rgba(255,255,255,0.15);
            transition: 0.3s;
            font-size: 13px;
        }
        .header-actions a:hover { background: rgba(255,255,255,0.25); }
        
        .controls-bar {
            background: white;
            padding: 10px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { font-size: 13px; color: #555; font-weight: 500; }
        .control-group input[type="date"] {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        .btn-primary {
            background: #1a237e;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-primary:hover { background: #0d1560; }
        
        .stats-bar {
            background: #f8f9fa;
            padding: 8px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }
        
        /* --- Flex layout to keep stats and message on the same line --- */
        .stats-wrapper {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 20px;
        }
        
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .stat-item .number { font-weight: bold; color: #1a237e; }
        
        .instruction-message {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #e3f2fd;
            color: #0d47a1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .instruction-message i { margin-right: 4px; }
        .instruction-message .close-btn {
            cursor: pointer;
            font-weight: bold;
            color: #888;
            font-size: 16px;
            line-height: 1;
            transition: 0.3s;
        }
        .instruction-message .close-btn:hover { color: #d32f2f; }
        .instruction-message.hidden { display: none; }
        /* ---------------------------------------------------------- */
        
        .app-container {
            display: flex;
            flex-wrap: wrap;
            height: calc(100vh - 180px);
        }
        
        #map-container {
            flex: 1;
            min-width: 300px;
            height: 100%;
            position: relative;
        }
        #map { height: 100%; width: 100%; }
        
        #analytics-panel {
            width: 400px;
            background: white;
            padding: 20px;
            border-left: 1px solid #e0e0e0;
            overflow-y: auto;
            height: 100%;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            font-size: 16px;
            color: #1a237e;
        }
        .loading-overlay.hidden { display: none; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a237e;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        
        .chart-header h2 { font-size: 18px; color: #1a237e; }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        .field-info {
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .field-info p { margin: 4px 0; font-size: 14px; }
        
        /* --- REMOVED .click-prompt completely --- */
        
        @media (max-width: 768px) {
            .app-container { flex-direction: column; height: auto; }
            #map-container { height: 50vh; min-height: 300px; }
            #analytics-panel { width: 100%; height: auto; border-left: none; border-top: 1px solid #e0e0e0; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1><i class="fas fa-chart-line"></i> Field NDVI Analytics</h1>
        <div class="header-actions">
            <a href="#">
                <i class="fas fa-map"></i> Back to Map
            </a>
        </div>
    </header>

    <div class="controls-bar">
        <div class="control-group">
            <label><i class="fas fa-calendar-alt"></i> Start:</label>
            <input type="date" id="startDate" value="2025-01-01">
        </div>
        <div class="control-group">
            <label>End:</label>
            <input type="date" id="endDate" value="2026-07-31">
        </div>
        <button class="btn-primary" onclick="refreshAnalytics()">
            <i class="fas fa-sync"></i> Refresh Graph
        </button>
    </div>

    <!-- Stats Bar + Instruction Message on the SAME line -->
    <div class="stats-bar">
        <div class="stats-wrapper">
            <div class="stat-item"><span class="number" id="totalFields">0</span><span>Total Fields</span></div>
            <div class="stat-item" id="selectedFieldInfo" style="color:#888;">No field selected</div>
        </div>
        
        <!-- New inline message with close button -->
        <div class="instruction-message" id="instructionMessage">
            <span><i class="fas fa-hand-pointer"></i> Click on any field on the map</span>
            <span class="close-btn" onclick="dismissMessage()">&times;</span>
        </div>
    </div>

    <div class="app-container">
        <div id="map-container">
            <div id="map"></div>
            <div class="loading-overlay hidden" id="mapLoading">
                <div class="spinner"></div>
                <span id="loadingText">Loading fields...</span>
            </div>
        </div>
        
        <div id="analytics-panel">
            <div class="chart-header">
                <h2 id="fieldTitle">Select a Field</h2>
                <span id="fieldIdDisplay" style="font-size:12px; color:#888;"></span>
            </div>
            
            <div class="field-info" id="fieldInfo">
                <p><strong>Crop:</strong> <span id="cropDisplay">-</span></p>
                <p><strong>Area:</strong> <span id="areaDisplay">-</span> ha</p>
            </div>
            
            <div class="chart-container" id="chartContainer" style="display:none;">
                <canvas id="ndviChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        var map, fieldLayer = null;
        var chartInstance = null;
        var fields = [];

        function initMap() {
            map = L.map('map').setView([-19.0, 29.5], 6);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);
            
            loadFields();
            window.addEventListener('resize', function() { map.invalidateSize(); });
        }

        function dismissMessage() {
            document.getElementById('instructionMessage').classList.add('hidden');
            localStorage.setItem('ndvi_instruction_closed', 'true');
        }
        
        function loadFields() {
            // Check if user previously closed the message
            if (localStorage.getItem('ndvi_instruction_closed') === 'true') {
                document.getElementById('instructionMessage').classList.add('hidden');
            }

            var overlay = document.getElementById('mapLoading');
            overlay.classList.remove('hidden');
            
            fetch('/api/fields/list/')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.error) throw new Error(data.error);
                    
                    fields = data.features || [];
                    document.getElementById('totalFields').textContent = fields.length;
                    
                    if (fields.length > 0) {
                        drawFields(fields);
                    }
                    
                    overlay.classList.add('hidden');
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    overlay.classList.add('hidden');
                    alert('Failed to load fields.');
                });
        }
        
        function drawFields(features) {
            if (fieldLayer) { map.removeLayer(fieldLayer); }
            
            fieldLayer = L.geoJSON(features, {
                style: function() {
                    return { 
                        color: '#1a237e', 
                        weight: 2, 
                        opacity: 0.8, 
                        fillColor: '#1a237e',
                        fillOpacity: 0.1 
                    };
                },
                onEachFeature: function(feature, layer) {
                    var p = feature.properties;
                    var fieldId = p.id || p.field_id || p.pk || feature.id;
                    
                    layer.bindPopup(`
                        <div style="min-width:150px;">
                            <h4 style="margin:0 0 4px 0; color:#1a237e;">${p.field_name}</h4>
                            <div style="font-size:12px;">
                                <strong>Crop:</strong> ${p.crop}<br>
                                <strong>Area:</strong> ${p.area_ha} ha
                            </div>
                            <div style="margin-top:6px; font-size:11px; color:#1a237e;">
                                <i class="fas fa-chart-line"></i> Click to view profile
                            </div>
                        </div>
                    `, { maxWidth: 250 });
                    
                    layer.on('click', function() {
                        loadAnalytics(fieldId);
                    });
                }
            }).addTo(map);
            
            try {
                var bounds = fieldLayer.getBounds();
                if (bounds.isValid()) { map.fitBounds(bounds, { padding: [40, 40] }); }
            } catch(e) {}
        }
        
        function loadAnalytics(fieldId) {
            document.getElementById('selectedFieldInfo').innerHTML = `<i class="fas fa-spinner fa-spin"></i> Loading NDVI...`;
            document.getElementById('chartContainer').style.display = 'block';
            
            var startDate = document.getElementById('startDate').value;
            var endDate = document.getElementById('endDate').value;
            
            var url = '/api/fields/ndvi-single/?field_id=' + fieldId + '&start_date=' + startDate + '&end_date=' + endDate + '&cloud_cover=30';
            
            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.success && data.data.length > 0) {
                        renderChart(data, fieldId);
                        updateFieldInfo(data);
                    } else {
                        document.getElementById('selectedFieldInfo').innerHTML = `<span style="color:#e74c3c;">Error: ${data.error || 'No data'}</span>`;
                    }
                })
                .catch(function(error) {
                    document.getElementById('selectedFieldInfo').innerHTML = `<span style="color:#e74c3c;">Network error</span>`;
                    console.error(error);
                });
        }
        
        function renderChart(data, fieldId) {
            var labels = [];
            var values = [];
            
            data.data.forEach(function(item) {
                labels.push(item.date);
                values.push(item.ndvi);
            });
            
            document.getElementById('fieldTitle').textContent = data.field_name || 'Field ' + fieldId;
            document.getElementById('fieldIdDisplay').textContent = 'ID: ' + fieldId;
            
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            var ctx = document.getElementById('ndviChart').getContext('2d');
            
            var gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(26, 35, 126, 0.5)');
            gradient.addColorStop(1, 'rgba(26, 35, 126, 0.05)');
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'NDVI',
                        data: values,
                        borderColor: '#1a237e',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        pointRadius: 3,
                        pointBackgroundColor: values.map(function(v) {
                            if (v >= 0.4) return '#1a9850';
                            if (v >= 0.2) return '#fdae61';
                            return '#d73027';
                        }),
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return 'NDVI: ' + context.parsed.y.toFixed(3);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { maxTicksLimit: 15, font: { size: 10 } },
                            grid: { display: false }
                        },
                        y: {
                            min: -0.2, max: 0.8,
                            ticks: { font: { size: 10 } }
                        }
                    }
                }
            });
            
            document.getElementById('selectedFieldInfo').innerHTML = `<span style="color:#1a237e; font-weight:bold;">${data.field_name}</span> (${data.data.length} records)`;
        }
        
        function updateFieldInfo(data) {
            var fieldObj = fields.find(function(f) {
                return f.id === data.field_id || f.properties.id === data.field_id;
            });
            
            if (fieldObj) {
                var p = fieldObj.properties;
                document.getElementById('cropDisplay').textContent = p.crop || '-';
                document.getElementById('areaDisplay').textContent = p.area_ha || '-';
            } else {
                document.getElementById('cropDisplay').textContent = '-';
                document.getElementById('areaDisplay').textContent = '-';
            }
        }
        
        function refreshAnalytics() {
            var fieldId = document.getElementById('fieldIdDisplay').textContent.replace('ID: ', '');
            if (fieldId && fieldId !== '') {
                loadAnalytics(parseInt(fieldId));
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
        });
    </script>

</body>
</html>
