<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimbabwe VCI - Ultra Fast</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 8px 16px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap;
        }
        .header h1 {
            font-size: 16px;
            color: #1a202c;
        }
        .header h1 span {
            color: #48bb78;
        }
        .header p {
            font-size: 11px;
            color: #718096;
            margin-top: 2px;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 10px 14px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 95%;
        }
        .controls select {
            padding: 5px 8px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 12px;
            background: white;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        .controls select:focus {
            outline: none;
            border-color: #48bb78;
        }
        .controls button {
            padding: 5px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: Arial, sans-serif;
        }
        .btn-primary {
            background: #48bb78;
            color: white;
        }
        .btn-primary:hover {
            background: #38a169;
        }
        .btn-primary:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #edf2f7;
            color: #2d3748;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .btn-danger {
            background: #fc8181;
            color: white;
        }
        .btn-danger:hover {
            background: #f56565;
        }
        
        .legend {
            position: absolute;
            bottom: 80px;
            right: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            min-width: 110px;
        }
        .legend-title {
            font-weight: 600;
            font-size: 11px;
            margin-bottom: 4px;
            color: #2d3748;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
            font-size: 10px;
            color: #4a5568;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(255,255,255,0.95);
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: none;
            text-align: center;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #48bb78;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .loading p {
            color: #4a5568;
            font-size: 13px;
            font-weight: 500;
        }
        
        .status {
            position: absolute;
            bottom: 75px;
            left: 10px;
            z-index: 1000;
            font-size: 10px;
            color: #718096;
            background: rgba(255,255,255,0.9);
            padding: 2px 8px;
            border-radius: 4px;
            backdrop-filter: blur(5px);
        }
        
        .info-box {
            position: absolute;
            top: 75px;
            right: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            min-width: 100px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .info-box .label {
            font-size: 10px;
            color: #718096;
            text-transform: uppercase;
            font-weight: 600;
        }
        .info-box .value {
            font-size: 16px;
            font-weight: 700;
            color: #2d3748;
            margin: 2px 0;
        }
        .info-box .sub {
            font-size: 10px;
            color: #718096;
            margin-top: 2px;
        }
        
        @media (max-width: 768px) {
            .header {
                width: 90%;
                padding: 6px 12px;
                top: 10px;
                white-space: normal;
            }
            .header h1 {
                font-size: 14px;
            }
            .header p {
                font-size: 10px;
            }
            .controls {
                padding: 8px;
                gap: 4px;
            }
            .controls select {
                font-size: 11px;
                padding: 4px 6px;
            }
            .controls button {
                font-size: 11px;
                padding: 4px 8px;
            }
            .legend {
                bottom: 70px;
                right: 8px;
                padding: 6px 8px;
                min-width: 90px;
            }
            .info-box {
                top: 65px;
                right: 8px;
                padding: 8px;
                min-width: 80px;
            }
            .info-box .value {
                font-size: 14px;
            }
        }
        
        @media (max-width: 480px) {
            .controls select {
                font-size: 10px;
                padding: 3px 5px;
            }
            .controls button {
                font-size: 10px;
                padding: 3px 6px;
            }
            .legend-item {
                font-size: 9px;
            }
            .legend-color {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Header -->
    <div class="header">
        <h1>🌿 Zimbabwe <span>VCI</span></h1>
        <p>12km resolution • Sentinel-2</p>
    </div>

    <!-- Info Box -->
    <div class="info-box">
        <div class="label">Images</div>
        <div class="value" id="imageCount">--</div>
        <div class="sub" id="monthInfo">Loading...</div>
    </div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-title">VCI</div>
        <div class="legend-item">
            <div class="legend-color" style="background:#8b0000;"></div>
            <span>Extreme</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#ff4500;"></div>
            <span>Severe</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#ffd700;"></div>
            <span>Moderate</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#7CFC00;"></div>
            <span>Healthy</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#006400;"></div>
            <span>Excellent</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <select id="yearSelect">
            <option value="2026" selected>2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
        </select>

        <select id="monthSelect">
            <option value="1">Jan</option>
            <option value="2">Feb</option>
            <option value="3">Mar</option>
            <option value="4">Apr</option>
            <option value="5">May</option>
            <option value="6">Jun</option>
            <option value="7" selected>Jul</option>
            <option value="8">Aug</option>
            <option value="9">Sep</option>
            <option value="10">Oct</option>
            <option value="11">Nov</option>
            <option value="12">Dec</option>
        </select>

        <button class="btn-primary" id="loadBtn" onclick="loadVCI()">Load</button>
        <button class="btn-secondary" onclick="centerZimbabwe()">📍</button>
        <button class="btn-danger" onclick="clearLayer()">✕</button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="loadingText">Loading VCI...</p>
    </div>

    <div class="status" id="status">Ready</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <script>
        // ============================================
        // CONFIG
        // ============================================
        const CONFIG = {
            scale: 12000,
            maxPixels: 1e7,
            baselineStart: 2018,
            baselineEnd: 2025,
            timeout: 30000,
            apiUrl: '/api/vci/calculate/'
        };

        // ============================================
        // GET CSRF TOKEN
        // ============================================
        function getCsrfToken() {
            const cookieValue = document.cookie
                .split('; ')
                .find(row => row.startsWith('csrftoken='));
            return cookieValue ? cookieValue.split('=')[1] : '';
        }

        // ============================================
        // MAP INITIALIZATION
        // ============================================
        const map = L.map('map', {
            center: [-19.0154, 29.1549],
            zoom: 6,
            zoomControl: true
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        const zimbabweBounds = [
            [-22.4, 25.2],
            [-15.6, 33.0]
        ];
        let currentLayer = null;
        let isLoading = false;

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function centerZimbabwe() {
            map.fitBounds(zimbabweBounds);
        }

        function clearLayer() {
            if (currentLayer) {
                map.removeLayer(currentLayer);
                currentLayer = null;
                document.getElementById('imageCount').textContent = '--';
                document.getElementById('monthInfo').textContent = 'Cleared';
                setStatus('Cleared');
            }
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function getMonthName(month) {
            const names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
            ];
            return names[parseInt(month) - 1] || month;
        }

        // ============================================
        // LOAD VCI - MAIN FUNCTION
        // ============================================
        async function loadVCI() {
            if (isLoading) return;

            const year = document.getElementById('yearSelect').value;
            const month = document.getElementById('monthSelect').value;

            const loading = document.getElementById('loading');
            const loadBtn = document.getElementById('loadBtn');

            isLoading = true;
            loading.classList.add('active');
            loadBtn.disabled = true;
            loadBtn.textContent = '⏳';
            document.getElementById('loadingText').textContent = 'Loading 12km VCI...';
            setStatus('Loading...');

            try {
                // Get current map bounds
                const bounds = map.getBounds();
                const geometry = {
                    type: 'Polygon',
                    coordinates: [
                        [
                            [bounds.getSouth(), bounds.getWest()],
                            [bounds.getSouth(), bounds.getEast()],
                            [bounds.getNorth(), bounds.getEast()],
                            [bounds.getNorth(), bounds.getWest()],
                            [bounds.getSouth(), bounds.getWest()]
                        ]
                    ]
                };

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), CONFIG.timeout);

                const csrfToken = getCsrfToken();

                console.log('🚀 Sending request to:', CONFIG.apiUrl);
                console.log('📦 Year:', year, 'Month:', month);

                const response = await fetch(CONFIG.apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        geometry: geometry,
                        year: parseInt(year),
                        month: parseInt(month),
                        baseline_start: CONFIG.baselineStart,
                        baseline_end: CONFIG.baselineEnd,
                        scale: CONFIG.scale,
                        maxPixels: CONFIG.maxPixels
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                console.log('📡 Response status:', response.status);

                // Handle 404
                if (response.status === 404) {
                    setStatus('❌ API endpoint not found');
                    throw new Error('API endpoint not found. Please check:\n' +
                        '1. Django server is running\n' +
                        '2. URL pattern is correct\n' +
                        '3. URL: ' + CONFIG.apiUrl);
                }

                if (!response.ok) {
                    throw new Error(`Server error (${response.status})`);
                }

                const data = await response.json();
                console.log('📥 Response data:', data);

                if (data.success) {
                    // Update map with tile layer
                    if (currentLayer) {
                        map.removeLayer(currentLayer);
                    }

                    currentLayer = L.tileLayer(data.tile_url, {
                        opacity: 0.85,
                        attribution: 'VCI © Sentinel-2',
                        maxZoom: 19
                    }).addTo(map);

                    // Update info
                    document.getElementById('imageCount').textContent = data.metadata.image_count || '--';
                    document.getElementById('monthInfo').textContent = getMonthName(month) + ' ' + year;

                    setStatus('✓ VCI loaded');
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    setStatus('⏱ Timeout');
                    alert('Request timed out. Please try again.');
                } else {
                    console.error('❌ Error:', error);
                    setStatus('✗ ' + error.message);
                    alert('Error: ' + error.message);
                }
            } finally {
                isLoading = false;
                loading.classList.remove('active');
                loadBtn.disabled = false;
                loadBtn.textContent = 'Load';
            }
        }

        // ============================================
        // AUTO-RELOAD ON MAP MOVE
        // ============================================
        let moveTimeout = null;
        map.on('moveend', function() {
            clearTimeout(moveTimeout);
            moveTimeout = setTimeout(() => {
                if (currentLayer && !isLoading) {
                    loadVCI();
                }
            }, 3000);
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        setTimeout(centerZimbabwe, 300);

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadVCI, 500);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !isLoading) loadVCI();
            if (e.key === 'r' || e.key === 'R') centerZimbabwe();
            if (e.key === 'c' || e.key === 'C') clearLayer();
        });

        // Console info
        console.log('🚀 Zimbabwe VCI - Ultra Fast (12km)');
        console.log('📊 Shortcuts: Enter=Load, R=Center, C=Clear');
        console.log('🔗 API URL:', CONFIG.apiUrl);
        console.log('⚡ Resolution: 12km for maximum speed');
    </script>

</body>
</html>
