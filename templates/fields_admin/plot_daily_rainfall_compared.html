<!DOCTYPE html>
<html>
<head>
    <title>🌧️ Daily Rainfall Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            background: #f0f2f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: white;
            padding: 20px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .header .subtitle {
            opacity: 0.9;
            font-size: 13px;
            margin-top: 4px;
        }
        .header .date-range-badge {
            float: right;
            background: rgba(255,255,255,0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .controls-card {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .controls label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
        }
        .controls input[type="date"] {
            padding: 6px 10px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 13px;
            background: white;
        }
        .controls input[type="date"]:focus {
            border-color: #26d0ce;
            outline: none;
        }
        .controls select {
            padding: 6px 10px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 13px;
            background: white;
            min-width: 120px;
        }
        .controls select:focus {
            border-color: #26d0ce;
            outline: none;
        }
        .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 41, 128, 0.3);
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-success {
            background: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background: #229954;
        }

        .quick-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            align-items: center;
        }
        .quick-buttons .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
            background: #e9ecef;
            color: #2c3e50;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-buttons .btn-sm:hover {
            background: #26d0ce;
            color: white;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: white;
            padding: 12px 15px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .stat-box .number {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
        }
        .stat-box .number.green { color: #27ae60; }
        .stat-box .number.blue { color: #3498db; }
        .stat-box .number.orange { color: #f39c12; }
        .stat-box .number.purple { color: #9b59b6; }
        .stat-box .number.red { color: #e74c3c; }
        .stat-box .label {
            font-size: 11px;
            color: #7f8c8d;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .chart-card h3 {
            font-size: 15px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .chart-container {
            position: relative;
            height: 400px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #7f8c8d;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #26d0ce;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #e74c3c;
            padding: 15px;
            background: #fdf2f2;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        .no-data .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .result {
            margin-top: 0;
        }

        @media (max-width: 768px) {
            .header .date-range-badge { float: none; display: inline-block; margin-top: 8px; }
            .controls { flex-direction: column; align-items: stretch; }
            .controls input[type="date"] { width: 100%; }
            .controls select { width: 100%; }
            .quick-buttons { justify-content: center; }
            .stats-row { grid-template-columns: repeat(3, 1fr); }
            .chart-container { height: 300px; }
        }
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .chart-container { height: 250px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🌧️ Daily Rainfall Chart</h1>
                <div class="subtitle">Dynamic rainfall plotting with custom date range</div>
            </div>
            <div class="date-range-badge" id="dateRangeBadge">Loading...</div>
        </div>

        <div class="controls-card">
            <div class="controls">
                <label>📍 Province:
                    <select id="provinceFilter">
                        <option value="">All Provinces</option>
                        <option value="Harare">Harare</option>
                        <option value="Bulawayo">Bulawayo</option>
                        <option value="Manicaland">Manicaland</option>
                        <option value="Mashonaland Central">Mashonaland Central</option>
                        <option value="Mashonaland East">Mashonaland East</option>
                        <option value="Mashonaland West">Mashonaland West</option>
                        <option value="Masvingo" selected>Masvingo</option>
                        <option value="Matabeleland North">Matabeleland North</option>
                        <option value="Matabeleland South">Matabeleland South</option>
                        <option value="Midlands">Midlands</option>
                    </select>
                </label>
                <label>📅 From: <input type="date" id="startDate"></label>
                <label>📅 To: <input type="date" id="endDate"></label>
                <div class="quick-buttons">
                    <button class="btn-sm" onclick="setQuickRange(7)">7d</button>
                    <button class="btn-sm" onclick="setQuickRange(30)">30d</button>
                    <button class="btn-sm" onclick="setQuickRange(90)">90d</button>
                    <button class="btn-sm" onclick="setQuickRange(365)">1y</button>
                    <button class="btn-sm" onclick="setQuickRange(0)">All</button>
                </div>
                <button class="btn btn-primary" onclick="loadData()">📊 Plot</button>
                <button class="btn btn-danger" onclick="clearDashboard()">✖ Clear</button>
            </div>
        </div>

        <div id="dashboard" class="result"></div>
    </div>

    <script>
        let currentData = null;
        let currentStartDate = '';
        let currentEndDate = '';
        let currentProvince = '';
        let chart = null;

        function setDefaultDates() {
            const today = new Date();
            const oneYearAgo = new Date(today);
            oneYearAgo.setFullYear(today.getFullYear() - 1);
            
            document.getElementById('startDate').value = oneYearAgo.toISOString().split('T')[0];
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
            
            updateDateBadge();
        }

        function updateDateBadge() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            if (start && end) {
                const s = new Date(start);
                const e = new Date(end);
                const diff = Math.ceil((e - s) / (1000 * 60 * 60 * 24));
                document.getElementById('dateRangeBadge').textContent = 
                    `${s.toLocaleDateString('en-ZW', { month: 'short', day: '2-digit', year: 'numeric' })} - ${e.toLocaleDateString('en-ZW', { month: 'short', day: '2-digit', year: 'numeric' })} (${diff} days)`;
            }
        }

        function setQuickRange(days) {
            const end = new Date();
            const start = new Date(end);
            
            if (days === 0) {
                // All data - go back 10 years
                start.setFullYear(end.getFullYear() - 10);
            } else {
                start.setDate(end.getDate() - days);
            }
            
            document.getElementById('startDate').value = start.toISOString().split('T')[0];
            document.getElementById('endDate').value = end.toISOString().split('T')[0];
            updateDateBadge();
            
            // Auto-plot
            loadData();
        }

        function clearDashboard() {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';
            currentData = null;
            if (chart) {
                chart.destroy();
                chart = null;
            }
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-ZW', { month: 'short', day: '2-digit' });
        }

        async function loadData() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const province = document.getElementById('provinceFilter').value;

            if (!startDate || !endDate) {
                alert('Please select both start and end dates.');
                return;
            }

            if (new Date(startDate) > new Date(endDate)) {
                alert('Start date must be before end date.');
                return;
            }

            currentStartDate = startDate;
            currentEndDate = endDate;
            currentProvince = province;
            updateDateBadge();

            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top:15px; font-size:16px;">Loading rainfall data...</p>
                    <p style="font-size:13px; color:#95a5a6;">${formatDate(startDate)} - ${formatDate(endDate)}</p>
                </div>
            `;

            try {
                let url = `/api/rainfall/export/?start_date=${startDate}&end_date=${endDate}&format=json`;
                if (province) {
                    url += `&province=${encodeURIComponent(province)}`;
                }

                console.log('Fetching:', url);
                const response = await fetch(url);
                const data = await response.json();
                console.log('Data:', data);

                if (data.success && data.data && data.data.length > 0) {
                    currentData = data;
                    renderChart(data);
                } else {
                    dashboard.innerHTML = `
                        <div class="no-data">
                            <span class="big-icon">📭</span>
                            <h3>No Data Found</h3>
                            <p>No rainfall data available for the selected date range.</p>
                            <p style="font-size:13px; color:#95a5a6;">${formatDate(startDate)} - ${formatDate(endDate)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                dashboard.innerHTML = `
                    <div class="error">
                        <strong>❌ Connection Error</strong>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function renderChart(data) {
            const dashboard = document.getElementById('dashboard');

            const records = data.data;
            const values = records.map(r => r.rainfall);
            const total = values.reduce((a, b) => a + b, 0);
            const avg = total / values.length;
            const max = Math.max(...values);
            const min = Math.min(...values);
            const rainyDays = values.filter(v => v > 1).length;
            const dryDays = values.filter(v => v <= 1).length;
            const totalDays = values.length;

            // Sort records by date
            const sortedRecords = [...records].sort((a, b) => a.date.localeCompare(b.date));
            const dates = sortedRecords.map(r => formatDate(r.date));
            const rainfallValues = sortedRecords.map(r => r.rainfall);

            let html = '';

            // Stats Row
            html += `
                <div class="stats-row">
                    <div class="stat-box">
                        <div class="number green">${total.toFixed(1)}mm</div>
                        <div class="label">Total Rainfall</div>
                    </div>
                    <div class="stat-box">
                        <div class="number blue">${avg.toFixed(1)}mm</div>
                        <div class="label">Daily Average</div>
                    </div>
                    <div class="stat-box">
                        <div class="number orange">${max.toFixed(1)}mm</div>
                        <div class="label">Maximum</div>
                    </div>
                    <div class="stat-box">
                        <div class="number purple">${min.toFixed(1)}mm</div>
                        <div class="label">Minimum</div>
                    </div>
                    <div class="stat-box">
                        <div class="number red">${rainyDays}</div>
                        <div class="label">Rainy Days</div>
                    </div>
                    <div class="stat-box">
                        <div class="number">${dryDays}</div>
                        <div class="label">Dry Days</div>
                    </div>
                    <div class="stat-box">
                        <div class="number">${totalDays}</div>
                        <div class="label">Total Days</div>
                    </div>
                </div>
            `;

            // Chart
            const start = new Date(currentStartDate);
            const end = new Date(currentEndDate);
            const diff = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
            
            html += `
                <div class="chart-card">
                    <h3>📈 Daily Rainfall - ${formatDate(currentStartDate)} to ${formatDate(currentEndDate)} (${data.filters.province || 'All Provinces'})</h3>
                    <div class="chart-container">
                        <canvas id="rainfallChart"></canvas>
                    </div>
                </div>
            `;

            // Metadata
            html += `
                <div style="padding:12px 15px; background:white; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.08); font-size:12px; color:#95a5a6; margin-top:15px;">
                    <strong>Metadata:</strong>
                    <br>Source: ${data.metadata.source || 'database'}
                    <br>Exported: ${data.metadata.exported_at}
                    <br>Date Range: ${data.date_range.start} to ${data.date_range.end}
                    <br>Province: ${data.filters.province || 'All'}
                    <br>Total Records: ${data.count}
                    <br>Days: ${diff}
                </div>
            `;

            dashboard.innerHTML = html;

            // Destroy existing chart
            if (chart) {
                chart.destroy();
                chart = null;
            }

            // Create chart
            setTimeout(() => {
                const ctx = document.getElementById('rainfallChart').getContext('2d');
                chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Daily Rainfall (mm)',
                            data: rainfallValues,
                            backgroundColor: '#26d0ce',
                            borderColor: '#1a2980',
                            borderWidth: 0.5,
                            borderRadius: 2,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            datalabels: { display: false }
                        },
                        scales: {
                            x: {
                                ticks: {
                                    maxTicksLimit: Math.min(30, dates.length),
                                    font: { size: 9 }
                                },
                                title: {
                                    display: true,
                                    text: 'Date',
                                    font: { size: 11 }
                                },
                                grid: { display: false }
                            },
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Rainfall (mm)',
                                    font: { size: 11 }
                                },
                                ticks: { font: { size: 10 } },
                                grid: { color: 'rgba(0,0,0,0.05)' }
                            }
                        }
                    }
                });
            }, 100);
        }

        // Listen to date changes for badge update
        document.getElementById('startDate').addEventListener('change', updateDateBadge);
        document.getElementById('endDate').addEventListener('change', updateDateBadge);

        window.onload = function() {
            setDefaultDates();
            setTimeout(loadData, 300);
        };
    </script>
</body>
</html>
